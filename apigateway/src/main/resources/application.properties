spring.application.name=apigateway
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Auth Service
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://authservice
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# Category Service
spring.cloud.gateway.server.webflux.routes[1].id=category-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://categoryservice
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/categories/**

# Product Service
spring.cloud.gateway.server.webflux.routes[2].id=product-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://productservice
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/products/**


# builder Service
spring.cloud.gateway.server.webflux.routes[3].id=builder-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://builderservice
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/layouts/**

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never